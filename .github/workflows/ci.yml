name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Configure
        run: >-
          cmake -S . -B build
          -D CMAKE_BUILD_TYPE=Release
          -D BUILD_TESTING=ON
          -D LOGLENS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  fuzz-smoke:
    name: Parser fuzz smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Configure fuzz target
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-fuzz
          -D CMAKE_BUILD_TYPE=RelWithDebInfo
          -D BUILD_TESTING=OFF
          -D LOGLENS_BUILD_FUZZERS=ON
          -D LOGLENS_WARNINGS_AS_ERRORS=ON

      - name: Build fuzz target
        run: cmake --build build-fuzz --target fuzz_parser --config RelWithDebInfo

      - name: Run bounded parser fuzz smoke
        run: >-
          ./build-fuzz/fuzz_parser
          -runs=2000
          -max_len=1024
          -timeout=2
          tests/fuzz/corpus/parser
